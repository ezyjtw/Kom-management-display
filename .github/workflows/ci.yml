name: CI/CD Pipeline

# Supply chain (spec §17.6): every action is pinned by commit SHA (the tag is in
# the trailing comment; Dependabot proposes updates), the workflow token is
# read-only, and each scan fails the build on a finding above the threshold.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run npm install and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate env schema alignment
        run: npx tsx scripts/validate-env-schema.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check test coverage thresholds
        run: |
          # BLOCKING. Vitest flags (the old Jest-style --coverageReporters made Vitest exit on an
          # unknown option, so the threshold check was silently skipped).
          set -o pipefail
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary 2>&1 | tee coverage-output.txt
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const thresholds = { lines: 50, branches: 40, functions: 45, statements: 50 };
              let failed = false;
              for (const [key, min] of Object.entries(thresholds)) {
                const pct = c[key].pct;
                if (pct < min) {
                  console.error('FAIL: ' + key + ' coverage ' + pct + '% is below threshold ' + min + '%');
                  failed = true;
                } else {
                  console.log('OK: ' + key + ' coverage ' + pct + '% >= ' + min + '%');
                }
              }
              if (failed) process.exit(1);
            "
          else
            echo "::error::Coverage summary not generated"
            exit 1
          fi

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # SCA. BLOCKING: critical fails outright; every high advisory must be fixed or listed in
      # .audit-exceptions.json with a mitigation and a reviewDate that has not passed.
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=critical 2>&1 || {
            echo "::error::Critical vulnerabilities found in production dependencies"
            exit 1
          }
          npm audit --omit=dev --json > audit.json || true
          node scripts/check-audit-exceptions.js < audit.json

      # Secret detection with a reviewed baseline (.secrets.baseline). A new finding fails the
      # build; a false positive is marked in the baseline or with `pragma: allowlist secret`.
      # TODO(CONFIRM-DETECT-SECRETS-BASELINE): align plugins/filters with the platform's baseline.
      - name: Secret detection (detect-secrets)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet detect-secrets==1.5.0
          git ls-files -z | grep -zvE '^(package-lock\.json|prisma/drift-baseline\.sql|\.secrets\.baseline)$' \
            | xargs -0 detect-secrets-hook --baseline .secrets.baseline

      # BLOCKING. Route guards (every route public-by-name or guarded, wrappers authenticate,
      # anonymous calls get 401), request schemas, fail-closed audit policy, CSRF on mutations,
      # security headers (nonce CSP, HSTS, frame and referrer policy), no secrets in env in
      # production, client scoping, no dangerouslySetInnerHTML.
      - name: Security control tests
        run: >-
          npx vitest run
          src/__tests__/api-route-guards.test.ts
          src/__tests__/every-api-route-has-a-schema.test.ts
          src/__tests__/control-mutations-fail-closed.test.ts
          src/__tests__/csrf-required-on-mutations.test.ts
          src/__tests__/security-headers-present.test.ts
          src/__tests__/no-secrets-in-env-in-production.test.ts
          src/__tests__/client-scoping-enforced.test.ts
          src/__tests__/no-dangerously-set-inner-html.test.ts

  schema-check:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        # Test-only service container (not shipped). TODO(CONFIRM-CI-IMAGE-PINS): pin by digest.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"
      SHADOW_DATABASE_URL: "postgresql://test:test@localhost:5432/shadow"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations to fresh database
        run: npx prisma migrate deploy

      # BLOCKING. Any drift between schema.prisma and the migrations fails the build. The
      # historical drift was reconciled in migration 0043, so prisma/drift-baseline.sql is empty
      # (docs/phase1/schema-drift.md); the fix for a failure is a migration, not the baseline.
      - name: Migration drift (blocking, against the reviewed baseline)
        run: |
          PGPASSWORD=test psql -h localhost -U test -d testdb -c 'CREATE DATABASE shadow'
          npx tsx scripts/check-migration-drift.ts

      # The append-only triggers (AuditLog, BackgroundJobRun) exercised in a real database.
      - name: Audit log is append-only (live)
        run: npx vitest run src/__tests__/audit-log-is-append-only.test.ts
        env:
          TEST_DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, schema-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Verify health endpoints exist
        run: |
          for f in src/app/api/health/route.ts src/app/api/health/liveness/route.ts src/app/api/health/readiness/route.ts; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done

      # SBOM per build, retained with the artefact (spec §17.6).
      - name: Generate SBOM (CycloneDX)
        run: npm run sbom

      - name: Retain SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

  docker:
    name: Docker Build & Image Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: false
          load: true
          tags: kommand-centre:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container image scan. Interim scanner until the platform's Wiz CI integration is wired
      # in (TODO(CONFIRM-WIZ-CI)); the threshold is critical and high with a fix available
      # (TODO(CONFIRM-VULN-THRESHOLD) with Platform Security).
      - name: Scan image (Trivy, interim)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kommand-centre:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
