name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Verify lockfile exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::package-lock.json is missing. Run npm install and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate env schema alignment
        run: npx tsx scripts/validate-env-schema.ts

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

      - name: Check test coverage thresholds
        run: |
          npm test -- --coverage --coverageReporters=json-summary 2>&1 | tee coverage-output.txt
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const c = require('./coverage/coverage-summary.json').total;
              const thresholds = { lines: 50, branches: 40, functions: 45, statements: 50 };
              let failed = false;
              for (const [key, min] of Object.entries(thresholds)) {
                const pct = c[key].pct;
                if (pct < min) {
                  console.error('FAIL: ' + key + ' coverage ' + pct + '% is below threshold ' + min + '%');
                  failed = true;
                } else {
                  console.log('OK: ' + key + ' coverage ' + pct + '% >= ' + min + '%');
                }
              }
              if (failed) process.exit(1);
            "
          else
            echo "WARNING: Coverage summary not generated, skipping threshold check"
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=critical 2>&1 || {
            echo "::error::Critical vulnerabilities found in production dependencies"
            exit 1
          }
          npm audit --omit=dev --audit-level=high 2>&1 || {
            echo "::warning::High-severity vulnerabilities in production dependencies"
          }

      - name: Check for secrets in code
        run: |
          MATCHES=$(grep -rn --include='*.ts' --include='*.tsx' \
            -E '(password|secret|api_key|apikey)\s*[:=]\s*["\x27][A-Za-z0-9+/]{20,}' \
            src/ --exclude-dir=node_modules 2>/dev/null | \
            grep -v 'process\.env' | grep -v '\.test\.' | grep -v 'type\s' | \
            grep -v 'placeholder' | grep -v 'example' || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES" | head -5
            echo "::error::Potential secrets found in source code"
            exit 1
          fi
          echo "No secrets detected"

      - name: Auth guard check
        run: |
          FAIL=0
          for f in $(find src/app/api -name 'route.ts' | grep -v '/health/' | grep -v '/auth/'); do
            if ! grep -qE 'requireAuth|requireRole' "$f"; then
              echo "::error::Missing auth guard in $f"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || exit 1
          echo "All API routes have auth guards"

      - name: Zod validation check
        run: |
          FAIL=0
          for f in $(find src/app/api -name 'route.ts' | grep -v '/health/' | grep -v '/auth/'); do
            if grep -qE 'export\s+async\s+function\s+(POST|PUT|PATCH)' "$f"; then
              if ! grep -qE 'safeParse|validateBody' "$f"; then
                echo "::warning::Missing Zod validation in $f"
                FAIL=1
              fi
            fi
          done
          [ "$FAIL" -eq 0 ] || echo "::warning::Some mutation routes lack Zod validation"
          echo "Validation check completed"

      - name: CSP header check
        run: |
          if ! grep -q "Content-Security-Policy" next.config.js; then
            echo "::error::No CSP header found"
            exit 1
          fi
          if grep -v '^\s*//' next.config.js | grep -q "unsafe-eval"; then
            echo "::error::unsafe-eval found in CSP"
            exit 1
          fi
          echo "CSP header validated"

  schema-check:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Apply migrations to fresh database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

      - name: Check for migration drift
        run: |
          npx prisma migrate diff --from-migrations ./prisma/migrations --to-schema-datamodel ./prisma/schema.prisma --exit-code 2>&1 || {
            echo "::warning::Migration drift detected — schema and migrations are out of sync"
          }
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/testdb"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, schema-check]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"

      - name: Verify health endpoints exist
        run: |
          for f in src/app/api/health/route.ts src/app/api/health/liveness/route.ts src/app/api/health/readiness/route.ts; do
            [ -f "$f" ] || { echo "::error::Missing $f"; exit 1; }
          done

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: kommand-centre:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
